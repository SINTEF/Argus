# Field mapping for the 58-column Strato log format, as in
# serial-emulator/Strato100363_260926_160307Eng.txt.
# Zero-based CSV column, sr_payload member, type (string/int/int64/double).
# Columns omitted from this file are ignored. Unmapped payload members are zero.
# Select it with ARGUS_SENSOR_FIELDS=/etc/argus/sensor-fields-strato58.conf.
0 time_stamp string
1 inlet_number int
2 p_mbars double
3 t0_degc double
4 t5_degc double
5 tgas_degc double
6 laser_pid_readout double
7 det_pid_readout double
8 win0_fit0 double
9 win0_fit1 double
10 win0_fit2 double
11 win0_fit3 double
12 win0_fit4 double
13 win0_fit5 double
14 win0_fit6 double
15 win0_fit7 double
16 win0_fit8 double
17 win0_fit9 double
18 win1_fit0 double
19 win1_fit1 double
20 win1_fit2 double
21 win1_fit3 double
22 win1_fit4 double
23 win1_fit5 double
24 win1_fit6 double
25 det_bkgd double
26 ramp_ampl double
# 27-30 Init/Final Win0/Win1 Chi2 and 31 Ref Pos have no payload members.
32 ch4_ppm_wet double
33 ch4_ppm double
34 h2o_ppm double
35 c2h6_ppb_wet double
36 c2h6_ppb double
37 r double
38 c2_c1 double
# Labelled "Battery Charge (V)", but the values (about 10644) are millivolts.
39 battery_charge_v double
40 power_input_mv double
41 current_ma double
42 soc_percent double
43 battery_t_degc double
44 fet_t_degc double
# Written as e.g. 1790438592.000; the reader accepts an all-zero fraction.
45 gps_time int64
46 latitude double
47 longitude double
48 altitude_m double
# This format has no CO2 column; co2_ppm (and the widget's CO2 value) stays 0.
# Weather block: the header labels do not match the values, so only direction
# and speed are mapped. Unconfirmed, by observed values:
#   49 "U (m/sec)"     ~22, looks like an air temperature
#   50 "V (m/sec)"     ~0.5, unknown
#   51 "W (m/sec)"     ~51, looks like relative humidity (%)
#   52 "Tanem (degC)"  ~22, temperature; plausibly tanem_degc
#   55 "RH(%)"         ~1019, looks like air pressure (hPa)
#   56 "Pressure"      -11361..7183, unknown
#   57 "Compass (deg)" 20..24, unknown
53 dir_deg double
54 speed_m_sec double
